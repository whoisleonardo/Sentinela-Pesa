server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota não-arquivo cai no index.html (React Router)
    location / {
        try_files $uri /index.html;
    }

    # Proxy reverso para a API — mantém o mesmo host:porta do frontend
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Server-Sent Events (/api/alerts/stream) precisa de buffering desligado,
    # senão o nginx segura os chunks e o "tempo real" vira "tempo enlatado".
    location /api/alerts/stream {
        proxy_pass http://backend:4000/api/alerts/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
